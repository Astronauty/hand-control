[project]
name = "hand-control"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
# numpy pinned <2: mediapipe 0.10.21 requires numpy 1.x. Verified mujoco/casadi/
# opencv all work under 1.26, so the whole sim + teleop stack shares one env
# (replaces the old conda environment.yml).
dependencies = [
    # simulation & control
    "casadi>=3.7.2",
    "mujoco>=3.6.0",
    "numpy>=1.26,<2",
    "scipy>=1.15.3",
    # UI / input
    "pynput>=1.8.2",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "seaborn>=0.13.2",
    # camera teleop (mediapipe pipeline)
    "mediapipe==0.10.21",
    "opencv-contrib-python==4.11.0.86",
    # NOTE: jax was in the old conda env but is never imported in this repo, and
    # jax>=0.6.2 forces numpy>=2.1 (conflicts with mediapipe). Dropped. Re-add
    # with a numpy-1.x-compatible pin (jax==0.6.2) only if MJX is ever used.
    "matplotlib>=3.10",
    # NOTE: sounddevice dropped — not imported in this repo, and it needs the
    # native PortAudio system lib (was provided by conda). Re-add + `apt install
    # libportaudio2` if audio I/O is ever needed.
    "protobuf>=4.25.8,<5",
    "sentencepiece>=0.2.1",
    "pyrealsense2>=2.58.3.10794",
    "pandas>=2.3.3",
    "pyarrow>=25.0.0",
]

[project.optional-dependencies]
# AnyTeleop baseline (the dex-retargeting finger backend, --mode anyteleop /
# contact_aware_w_anyteleop). Kept optional so the base install stays lean and the
# add-on is fully removable (`uv sync` without --extra prunes it). Pinned <0.5.0:
# 0.5.0+ requires numpy>=2 (conflicts with the numpy<2 pin above), while its changelog
# confirms 0.5.0 is packaging-only — the retargeting algorithm/configs are IDENTICAL to
# 0.4.6, so there is no accuracy cost. `torch` is pinned to the CPU build (see the
# [tool.uv] torch-cpu index below) to avoid pulling the ~5GB CUDA stack.
# Install:  uv sync --extra anyteleop
# The LEAP URDF is vendored in anyteleop/assets/ (not shipped by the wheel).
anyteleop = ["dex-retargeting==0.4.6", "torch==2.14.0+cpu"]

[tool.uv]
# Scope the PyTorch CPU wheel index to torch only, so the base environment (which has no
# torch) is completely unaffected; the CUDA-heavy default torch is never resolved.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
