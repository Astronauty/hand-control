[project]
name = "hand-control"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
# numpy pinned <2: mediapipe 0.10.21 requires numpy 1.x. Verified mujoco/casadi/
# opencv all work under 1.26, so the whole sim + teleop stack shares one env
# (replaces the old conda environment.yml).
dependencies = [
    # simulation & control
    "casadi>=3.7.2",
    "mujoco>=3.6.0",
    "numpy>=1.26,<2",
    "scipy>=1.15.3",
    # UI / input
    "pynput>=1.8.2",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "seaborn>=0.13.2",
    # camera teleop (mediapipe pipeline)
    "mediapipe==0.10.21",
    "opencv-contrib-python==4.11.0.86",
    # NOTE: jax was in the old conda env but is never imported in this repo, and
    # jax>=0.6.2 forces numpy>=2.1 (conflicts with mediapipe). Dropped. Re-add
    # with a numpy-1.x-compatible pin (jax==0.6.2) only if MJX is ever used.
    "matplotlib>=3.10",
    # NOTE: sounddevice dropped — not imported in this repo, and it needs the
    # native PortAudio system lib (was provided by conda). Re-add + `apt install
    # libportaudio2` if audio I/O is ever needed.
    "protobuf>=4.25.8,<5",
    "sentencepiece>=0.2.1",
    "pyrealsense2>=2.58.3.10794",
    "pandas>=2.3.3",
    "pyarrow>=25.0.0",
]
